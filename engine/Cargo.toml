[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
num-complex = "0.4"
rustfft = "6.4"

# The 3D solver's checks take minutes unoptimized; optimize it even in test builds.
[profile.dev.package.seatlock-fdtd]
opt-level = 3

# The 3D solver's echo fitting (harmonic inversion) uses these for its matrix algebra.
[profile.dev.package.nalgebra]
opt-level = 3

[profile.dev.package.matrixmultiply]
opt-level = 3

# Scoring and the optimizer run many simulations; tests stay fast enough only when optimized.
[profile.dev.package.seatlock-sim]
opt-level = 2

[profile.dev.package.seatlock-acoustics]
opt-level = 2

[profile.dev.package.seatlock-correct]
opt-level = 2

[profile.dev.package.seatlock-dsp]
opt-level = 2

# Dense BEM matrix fills; keep release-like speed in tests.
[profile.dev.package.seatlock-bem]
opt-level = 3
