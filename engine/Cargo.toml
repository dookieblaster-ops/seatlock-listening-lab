[workspace]
resolver = "2"
members = [
    "crates/seatlock-core",
    "crates/seatlock-geom",
    "crates/seatlock-acoustics",
    "crates/seatlock-fdtd",
    "crates/seatlock-dsp",
    "crates/seatlock-correct",
    "crates/seatlock-sim",
    "crates/seatlock-wasm",
    "crates/seatlock-rt",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
