[package]
name = "seatlock-core"
description = "Constants, units, design types, errors, and kind registry for Seatlock."
version.workspace = true
edition.workspace = true

[dependencies]
num-complex.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs = { version = "10.1.0", optional = true, features = ["serde-compat"] }

[features]
default = []
typescript = ["dep:ts-rs"]

[dev-dependencies]
pretty_assertions = "1.4.1"
